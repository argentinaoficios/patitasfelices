<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patitas Felices | Tienda para mascotas</title>
  <meta name="description" content="Tienda online para mascotas. Pedidos por WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
  <!-- Tailwind por CDN: no hace falta instalar ni compilar nada -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          surface: "#fbf8ff", "surface-container-lowest": "#ffffff", "surface-container-low": "#f4f2ff", "surface-container": "#edecff",
          "surface-container-high": "#e6e6ff", "surface-container-highest": "#e0e0fc", "on-surface": "#181a2e", "on-surface-variant": "#564338",
          "inverse-surface": "#2d2f44", "inverse-on-surface": "#f1efff", outline: "#897266", "outline-variant": "#ddc1b3",
          primary: "rgb(var(--c-primary) / <alpha-value>)", "on-primary": "#ffffff",
          "primary-container": "rgb(var(--c-primary-container) / <alpha-value>)",
          "on-primary-container": "rgb(var(--c-on-primary-container) / <alpha-value>)",
          "primary-fixed": "rgb(var(--c-primary-fixed) / <alpha-value>)",
          secondary: "rgb(var(--c-secondary) / <alpha-value>)", "on-secondary": "#ffffff",
          "secondary-container": "rgb(var(--c-secondary-container) / <alpha-value>)",
          "on-secondary-container": "rgb(var(--c-on-secondary-container) / <alpha-value>)",
          error: "#ba1a1a", "error-container": "#ffdad6",
        },
        fontFamily: { heading: ["Plus Jakarta Sans", "system-ui", "sans-serif"], body: ["Inter", "system-ui", "sans-serif"] },
        borderRadius: { DEFAULT: "0.5rem", lg: "1rem", xl: "1.5rem" },
        boxShadow: { soft: "0 4px 20px -4px rgb(var(--c-primary) / 0.14)", lift: "0 12px 32px -8px rgb(var(--c-primary) / 0.3)" },
        keyframes: {
          "pop-in": { "0%": { opacity: "0", transform: "translateY(10px) scale(0.96)" }, "100%": { opacity: "1", transform: "none" } },
          "window-in": { "0%": { opacity: "0", transform: "translateY(16px) scale(0.92)" }, "100%": { opacity: "1", transform: "none" } },
          dot: { "0%, 80%, 100%": { transform: "translateY(0)", opacity: "0.4" }, "40%": { transform: "translateY(-4px)", opacity: "1" } },
          ring: { "0%": { boxShadow: "0 0 0 0 rgb(var(--c-primary) / 0.45)" }, "100%": { boxShadow: "0 0 0 16px rgb(var(--c-primary) / 0)" } },
        },
        animation: {
          "pop-in": "pop-in 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both", "window-in": "window-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both",
          dot: "dot 1.2s infinite ease-in-out", ring: "ring 2.2s infinite ease-out",
        },
      } },
    };
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-surface font-body text-on-surface antialiased">
  <div id="cabecera"></div>
  <main id="app" class="min-h-[60vh]"><p class="p-10 text-center text-on-surface-variant">Cargando…</p></main>
  <div id="pie"></div>
  <div id="chat"></div>
  <div id="avisos" class="pointer-events-none fixed inset-x-0 top-4 z-[60] flex flex-col items-center gap-2 px-4"></div>

  <noscript><p style="padding:2rem;text-align:center">Esta tienda necesita JavaScript activado.</p></noscript>
  <script src="js/ajustes.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
